name: Idea
description: A new slide mechanic, level, deck or plugin idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should become a playable factory, and what would it teach?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - A new slide mechanic
        - A new level or world
        - A deck
        - A plugin
        - Something else
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Papers, books or talks it draws on, if any.
